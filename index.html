<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Antivirus — No Clickbait</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #713d5c;
      background:
        radial-gradient(circle at 15% 15%, #fff7fc 0 8%, transparent 9%),
        radial-gradient(circle at 85% 80%, #ffe2f0 0 10%, transparent 11%),
        linear-gradient(135deg, #ffe7f2, #f8d9ff 55%, #ffeef7);
    }
    .wrap { width: min(100%, 440px); text-align: center; }
    .eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #b46b91; }
    h1 { font-size: clamp(30px, 8vw, 42px); margin: 12px 0; color: #a94e7e; }
    p { color: #93617d; line-height: 1.6; }
    .link {
      display: inline-block; margin-top: 20px; padding: 15px 23px;
      border-radius: 999px; color: white; text-decoration: none; font-weight: 750;
      background: linear-gradient(110deg, #ed83b3, #bb83e8);
      box-shadow: 0 12px 28px #c77ca744; transition: transform .18s, box-shadow .18s;
    }
    .link:hover { transform: translateY(-3px); box-shadow: 0 16px 32px #c77ca766; }
    .card {
      display: none; margin-top: 26px; padding: 34px 24px; border-radius: 28px;
      background: #fffafd; border: 1px solid #ffffff; 
      box-shadow: 0 18px 55px #a85b8830; animation: pop .45s ease both;
    }
    .card.show { display: block; }
    .heart { font-size: 52px; line-height: 1.2; }
    .message { font-family: Georgia, serif; font-size: clamp(30px, 8vw, 42px); 
      font-weight: bold; color: #d45b98; line-height: 1.15; margin: 15px 0 8px; }
    .tiny { font-size: 13px; color: #b17b9b; }
    @keyframes pop { from { opacity: 0; transform: scale(.88) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">✨ a totally serious download page ✨</div>
    <h1>Free Antivirus</h1>
    <p>Click below to get your completely real, definitely-not-a-prank antivirus.</p>
    <a class="link" href="#surprise" id="reveal">Free antivirus no clickbait</a>
    <section class="card" id="surprise" aria-live="polite">
      <div class="heart">🎀 💗 🎀</div>
      <div class="message">You're a good girl</div>
      <p class="tiny">Certified with 100% pink glitter energy.</p>
    </section>
  </main>
  <script>
    document.getElementById('reveal').addEventListener('click', function () {
      document.getElementById('surprise').classList.add('show');
      this.textContent = 'Antivirus successfully installed 💗';
    });
  </script>
</body>
</html>
